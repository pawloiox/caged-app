<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CAGED Lab</title>
    <meta
      name="description"
      content="Learn the CAGED system on guitar: five shapes, any chord, anywhere on the neck. Listens to your guitar and works offline."
    />
    <meta name="theme-color" content="#2b1a10" />
    <script>
      // First paint in the player's theme (wood unless they chose otherwise), before the app loads.
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('caged-lab:theme') || 'dark';
        } catch (e) {}
        if (t === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>CAGED Lab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
