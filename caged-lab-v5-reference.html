<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAGED Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: lesson rail on the left, a workbench whose hero is a playable rosewood fretboard */
  --bg:#eef1f2;
  --surface:#ffffff;
  --surface-2:#f5f7f7;
  --ink:#14212b;
  --muted:#55636f;
  --line:#d4dce0;
  --accent:#0d6876;
  --accent-ink:#ffffff;
  --accent-soft:#d9eef0;
  --good:#1c8549;
  --bad:#c0392b;
  --warn:#a86b12;
  --c-shape:#cc432d;
  --a-shape:#f2a922;
  --g-shape:#23864c;
  --e-shape:#1f6fc4;
  --d-shape:#7d47c9;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#172027; --surface-2:#1d2830; --ink:#e3eaee; --muted:#94a4af; --line:#2b3842;
    --accent:#4db7c5; --accent-ink:#05262b; --accent-soft:#153a40; --good:#4cc47f; --bad:#ef6b5a; --warn:#e5a94a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --surface-2:#1d2830; --ink:#e3eaee; --muted:#94a4af; --line:#2b3842;
  --accent:#4db7c5; --accent-ink:#05262b; --accent-soft:#153a40; --good:#4cc47f; --bad:#ef6b5a; --warn:#e5a94a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,1.1rem + 1.6vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h1:focus{outline:none}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
kbd{font:600 10.5px var(--font-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:8px;opacity:.6}
@media (hover:none){ kbd{display:none} }
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.15rem var(--font-display)}
.brand svg{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.chip b{font-weight:600}
button.chip,a.chip,summary.chip{cursor:pointer}
button.chip:hover,a.chip:hover,summary.chip:hover{border-color:var(--accent)}
.chip.timer,.chip.next-up{border-color:var(--accent);color:var(--accent);font-weight:600}
.settings{position:relative}
.settings summary{list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.14)}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 55px)}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-h{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:500}
.nav-item:hover{background:var(--surface)}
.nav-item.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.num{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);font:600 12px var(--font-mono);color:var(--muted)}
.num.done{background:var(--good);border-color:var(--good);color:#fff}
.num.icon{border-radius:7px}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 10px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1180px}

/* Lesson parts */
.lesson-head{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.eyebrow{font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);font-size:1.03rem;max-width:65ch}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.board-wrap{overflow-x:auto;border-radius:12px;background:var(--surface-2);padding:8px 6px;scroll-behavior:smooth;display:flex}
.fb{display:block;width:100%;height:auto;margin:0 auto;flex:1 0 auto}
.str-col{display:none;flex:none;width:22px;position:sticky;left:-6px;z-index:2;background:var(--surface-2);margin:0 0 0 -6px}
.str-col.right{order:2;left:auto;right:-6px;margin:0 -6px 0 0}
.str-col span{position:absolute;left:0;width:100%;transform:translateY(-50%);text-align:center;font:600 12px var(--font-mono);color:var(--muted)}
.skip{position:absolute;left:-9999px}
.skip:focus{position:static}
.quiz-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.welcome-line{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.welcome-line details{flex:1 1 100%}
.welcome-line summary{cursor:pointer;font-weight:600;color:var(--accent)}
.welcome-line ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (max-width: 860px){ .str-col{display:block} .fb .slabel{display:none} }
.board-wrap.pivot .link-ring{stroke-width:3.6;stroke-opacity:1;animation:none}
.p5-bar{position:static;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);margin:0 -16px -16px;padding:10px 16px;border-radius:0 0 16px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bench.playing .p5-bar{position:sticky}
.p5-now{font:600 14px var(--font-body)}
.p5-now strong{font:800 1.15rem var(--font-display)}
.fb .ghost-ring{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1}
.welcome{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.welcome ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.keys button{min-width:38px;font-family:var(--font-mono);font-size:13px}
.shape-btns{display:flex;gap:8px;flex-wrap:wrap}
.shape-btn{position:relative;width:52px;height:52px;border-radius:12px;border:2px solid var(--sc);background:var(--surface);font:800 1.35rem var(--font-display);cursor:pointer;color:var(--ink)}
.shape-btn.on{background:var(--sc);color:#fff}
.shape-btn.on.dark-text{color:#2a1b00}
.shape-btn .tick{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:var(--good);color:#fff;font:600 11px/19px var(--font-body)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check.disabled{opacity:.55;cursor:default}
.field{display:inline-flex;align-items:center;gap:8px;font-size:14px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=range]{accent-color:var(--accent)}
output{font-family:var(--font-mono);font-size:13px;min-width:62px}
.muted{color:var(--muted)}
.now{display:flex;align-items:center;gap:8px;padding:0 6px;flex-wrap:wrap}
.shape-pill{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:var(--sc);color:#fff;font:800 13px var(--font-display)}
.shape-pill.A{color:#2a1b00}

.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card ol,.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.card p{max-width:65ch}
.tab{display:inline-grid;grid-template-columns:auto repeat(6,34px);font:600 15px var(--font-mono);border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.tab span{text-align:center;padding:4px 0}
.tab .h{background:var(--surface-2);color:var(--muted);font-size:12px}
.tab .rl{font:600 11px var(--font-body);color:var(--muted);text-align:left;padding:4px 8px;background:var(--surface-2)}
.tab .fg{color:var(--accent)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 8px;border-radius:8px;border:1.5px dashed var(--line);font:600 13px var(--font-mono);color:var(--muted)}
.pchip.done{border-style:solid;border-color:var(--good);color:var(--good)}
.criteria{list-style:none;padding:0 !important}
.criteria li{display:flex;gap:8px;align-items:baseline}
.criteria li::before{content:"○";color:var(--muted);font-weight:600}
.criteria li.ok::before{content:"✓";color:var(--good)}
.links{list-style:none;padding:0 !important}
.links li{display:grid;grid-template-columns:auto auto auto 1fr;gap:8px;align-items:center}
.next{display:flex;justify-content:flex-end}
.readout{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.chord-big{font:800 2.3rem/1 var(--font-display)}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-row input{width:100%}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0}
.callout.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.drill{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tipbox{font-size:14px}

table.shapes{border-collapse:collapse;font:14px var(--font-mono);width:100%}
table.shapes th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:4px}
table.shapes td{text-align:center;padding:5px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.shapes tr[data-act]{cursor:pointer}
table.shapes tr[data-act]:hover td{background:var(--surface-2)}
table.shapes tr.on td{background:var(--accent-soft)}
.table-wrap{overflow-x:auto}
.ring{width:100%;max-width:240px;align-self:center}
.ring text{font-family:var(--font-display)}

/* Step 5 */
.chord-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chord-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.chord-card strong{font:800 1.5rem/1.1 var(--font-display)}
.chord-card .roman{font:600 12px var(--font-mono);color:var(--muted)}
.chord-card.on{border-color:var(--sc);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 30%,transparent)}
.chord-card .meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.beats{display:flex;gap:6px;margin:0 6px;align-items:center}
.beats > span:not(.countin){width:12px;height:12px;border-radius:50%;background:var(--line)}
.beats > span.on{background:var(--accent)}
.pattern{display:inline-grid;grid-template-columns:repeat(8,30px);border:1px solid var(--line);border-radius:8px;overflow:hidden;font:600 13px var(--font-mono);text-align:center}
.pattern span{padding:3px 0}
.pattern .c{background:var(--surface-2);color:var(--muted);font-size:11px}
.pattern .on{background:var(--accent);color:var(--accent-ink)}
.countin{font:800 1.4rem var(--font-display);color:var(--accent);min-width:2ch}

/* Practice */
.routine{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.timer-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.big-time{font:800 3.6rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.blocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.blocks li{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.blocks li.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.blocks li.done{opacity:.6}
.blocks li > div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mins{font:600 13px var(--font-mono);color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days span{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.days span.on{background:var(--good);border-color:var(--good)}
.stat{font:800 2rem/1 var(--font-display)}

/* Train */
.scorebar{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.scorebar b{color:var(--ink)}
.answers{display:flex;flex-wrap:wrap;gap:10px}
.answers .shape-btn{width:60px;height:56px}
.answers .opt{min-width:84px;justify-content:center;font:600 1.1rem var(--font-display);padding:10px 16px}
.answers .right{border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent)}
.answers .wrong{border-color:var(--bad);opacity:.8}
.feedback{min-height:1.5em}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.mastery{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:28px 1fr 74px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.mbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.mbar span{display:block;height:100%}
.ear-hidden{display:grid;place-items:center;min-height:140px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:14px;text-align:center;padding:16px}

/* Fretboard SVG */
.fb .wire{stroke:#c9c2b3;stroke-width:2.2}
.fb .nut{fill:#efe7d4}
.fb .string{stroke:#e2ddd1}
.fb .inlay{fill:#e8dfcb;opacity:.45}
.fb .slabel{fill:var(--muted);font:600 12px var(--font-mono);text-anchor:middle}
.fb .fnum{fill:var(--muted);font:11px var(--font-mono);text-anchor:middle}
.fb .fnum.mk{fill:var(--ink);font-weight:600}
.fb .hit{fill:transparent;cursor:pointer}
.fb .hit:hover{fill:rgba(255,255,255,.07)}
.fb .hit:focus{outline:none}
.fb .hit:focus-visible{fill:rgba(255,255,255,.16);stroke:#ffd27a;stroke-width:2.5}
.fb .dot{cursor:pointer}
.fb .dfill{stroke:rgba(0,0,0,.35);stroke-width:1}
.fb .rootring{fill:none;stroke:#fff;stroke-width:2.6}
.fb .dlabel{font:600 11px var(--font-body);text-anchor:middle;pointer-events:none}
.fb .dot.dim{opacity:.4}
.fb .dot.dim .rootring{stroke-width:1.5}
.fb .link-ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 3;animation:linkpulse 1.6s ease-in-out infinite}
.fb .third-ring{fill:none;stroke:#ffd27a;stroke-width:2.2}
.fb .dot.flash .dfill{animation:flash .4s ease-out}
.fb .dot .dfill{transform-box:fill-box;transform-origin:center}
.fb .ghost{fill:rgba(20,10,5,.62);stroke-width:1.8}
.fb .ghost.next{fill:rgba(20,10,5,.45);stroke-width:2.6}
.fb .glabel{fill:#f3ecdc;font:600 10.5px var(--font-body);text-anchor:middle;pointer-events:none}
#p5-board.soon .ghost.next{stroke-width:3.6;animation:linkpulse .5s ease-in-out infinite}
.fb .zone{cursor:pointer}
.fb .zone rect{opacity:.32}
.fb .zone:hover rect,.fb .zone:focus-visible rect{opacity:.6}
.fb .zone:focus{outline:none}
.fb .zone:focus-visible rect{stroke:var(--ink);stroke-width:2}
.fb .zone.active rect{opacity:1}
.fb .zone text{font:700 10.5px var(--font-display);text-anchor:middle;pointer-events:none}
.fb .zone:not(.active) text{fill:var(--ink) !important}
.fb .muted-x{fill:var(--ink);font:600 15px var(--font-mono);text-anchor:middle}
.fb .muted-x.onboard{fill:#f3ecdc}
.fb .dot.anchor .dfill{stroke:#f3ecdc;stroke-width:1.8;stroke-opacity:.9}
.fb .barre{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.55);stroke-width:1.5}
.fb .band{fill:rgba(255,206,110,.10);stroke:#f1bf55;stroke-width:2}
.fb .band-label{fill:var(--warn);font:700 11px var(--font-body);text-anchor:middle}
.fb .dot.sel .dfill{stroke:#fff;stroke-width:3.2}
@keyframes flash{0%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes linkpulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;flex-direction:row;overflow-x:auto;gap:14px}
  .nav-group{flex-direction:row;align-items:center;gap:4px}
  .nav-h{display:none}
  .nav-item{white-space:nowrap;padding:6px 10px}
  .side-foot{display:none}
  .routine{grid-template-columns:1fr}
  .timer-card{position:static}
  .topbar{padding:8px 14px}
  .chip.opt{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>

  const played = frets.filter(f => f != null);

}

    const base = shapeFrets(s, q, keyPc);
    for(const o of [0, 12, 24]){
      const inst = makeInstance(s, q, keyPc, base.map(f => f == null ? null : f + o));
      if(inst.maxF <= maxFret) list.push(inst);

  const out = [];

    out.push({s, f, midi, iv:((midi - inst.keyPc) % 12 + 12) % 12});

function sharedRoots(a, b){
  const rb = new Set(rootsOf(b).map(n => n.s + ':' + n.f));

// On an exact tie, take the pair that sits closer to the box's other strings.
function pentBox(inst){

const COL = {C:'var(--c-shape)', A:'var(--a-shape)', G:'var(--g-shape)', E:'var(--e-shape)', D:'var(--d-shape)'};

function planProgression(chords, zone, voicing){
  const zc = (zone.lo + zone.hi) / 2;

    const list = instances(ch.pc, ch.q).map(inst => {

/* ================= Audio: Karplus-Strong plucked string ================= */
const audio = {ctx:null, out:null, muted:store.get('muted', false), voices:[], cache:new Map()};

}
function ac(){

      const body = ctx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 210; body.Q.value = 0.9; body.gain.value = 4;

    if(wrap.scrollWidth <= wrap.clientWidth + 4) return;
    let els = [...wrap.querySelectorAll('.dot:not(.dim)')];
    const extra = wrap.querySelector('.band'); if(extra) els = [extra];
    if(!els.length) return;
    const wr = wrap.getBoundingClientRect(); let lo = Infinity, hi = -Infinity;
    els.forEach(el => { const r = el.getBoundingClientRect(); lo = Math.min(lo, r.left); hi = Math.max(hi, r.right); });

/* ================= Map views (Steps 3, 4 and the explorer) ================= */
function mapBoard(st, list){
  const act = st.focus ? st.idx : null;
  const pos = new Map();
  list.forEach((inst, i) => notesOf(inst, stringsFor(st.voicing, inst)).forEach(n => {
    const k = n.s + ':' + n.f; if(!pos.has(k)) pos.set(k, {...n, shapes:[]}); pos.get(k).shapes.push(i);
  }));
  const links = new Set();
  if(act != null) for(const j of [act - 1, act + 1]) if(list[j]) sharedRoots(list[act], list[j]).forEach(n => links.add(n.s + ':' + n.f));
  const dots = [...pos.values()].map(p => {
    const inAct = act != null && p.shapes.includes(act);
    const owner = list[inAct ? act : p.shapes[0]];
    const cols = inAct ? [COL[list[act].shape]] : p.shapes.map(i => COL[list[i].shape]);
    const one = cols.length === 1 ? owner.shape : null;
    return {s:p.s, f:p.f, colors:cols, root:p.iv === 0, label:prefs.labels === 'shape' && !inAct && p.shapes.length > 1 ? p.shapes.map(i => list[i].shape).join('') : dotLabel(p.iv, owner, p.s, stringsFor(st.voicing, owner)), text:one ? textFor(one) : '#fff', dim:(act != null && !inAct) || (st.rootsOnly && p.iv !== 0), ring:inAct && links.has(p.s + ':' + p.f)};
  });
  if(act != null){
    // Roots the chosen voicing leaves out are still the anchors for linking: keep them visible.
    const a = list[act]; const shown = new Set(notesOf(a, stringsFor(st.voicing, a)).map(n => n.s + ':' + n.f));
    rootsOf(a).filter(n => !shown.has(n.s + ':' + n.f)).forEach(n => dots.push({s:n.s, f:n.f, colors:['#3a2216'], label:'R', text:'#f3ecdc', cls:'anchor', ring:links.has(n.s + ':' + n.f)}));
  }
  let ghosts = [];
  if(st.pent && act != null){
    const inst = list[act]; const own = new Set(notesOf(inst, stringsFor(st.voicing, inst)).map(n => n.s + ':' + n.f));
    ghosts = pentBox(inst).filter(n => !own.has(n.s + ':' + n.f)).map(n => ({s:n.s, f:n.f, color:COL[inst.shape], label:prefs.labels === 'finger' ? '' : prefs.labels === 'note' ? spell(keyName(st.key, st.q), n.iv) : prefs.labels === 'iv' ? IV_INFO[n.iv].lab : ''}));
  }
  const zones = list.map((inst, i) => ({lo:inst.minF, hi:inst.maxF, label:inst.shape, color:COL[inst.shape], active:i === act, id:i}));
  const rn = keyName(st.key, st.q);
  const cellLabel = (s, f) => {
    const p = pos.get(s + ':' + f); if(!p) return BOTH_NAMES[(OPEN[s] + f) % 12];
    return `${spell(rn, p.iv)}, the ${p.iv === 0 ? 'root' : p.iv === 7 ? '5th' : '3rd'} of ${chordLabel(st.key, st.q)}, in the ${p.shapes.map(i => list[i].shape).join(' and ')}-shape`;
  };
  const muted = act != null ? mutedOf(list[act], stringsFor(st.voicing, list[act])).map(ms => ({s:ms, f:Math.max(0, list[act].minF - 1)})) : [];
  return board({from:0, to:MAX_FRET, dots, ghosts, zones, muted, cellLabel, label:`${chordLong(st.key, st.q)} in its CAGED shapes`});
}
function ringSVG(list, idx){
  const start = list[0].shape; const si = ORDER.indexOf(start); const active = list[idx].shape;
  const present = new Set(list.map(i => i.shape));
  const cx = 110, cy = 110, R = 70; const pt = (i, r) => { const a = (-90 + i * 72) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let o = `<svg class="ring" viewBox="0 0 220 220" role="img" aria-label="The CAGED loop starting at the ${start}-shape"><defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>`;
  for(let i = 0; i < 5; i++){
    const a1 = (-90 + i * 72 + 17) * Math.PI / 180, a2 = (-90 + (i + 1) * 72 - 17) * Math.PI / 180;
    o += `<path d="M${(cx + R * Math.cos(a1)).toFixed(1)} ${(cy + R * Math.sin(a1)).toFixed(1)}A${R} ${R} 0 0 1 ${(cx + R * Math.cos(a2)).toFixed(1)} ${(cy + R * Math.sin(a2)).toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#arr)"/>`;
  }
  ORDER.forEach((s, i) => {
    const [x, y] = pt(i, R); const [bx, by] = pt(i, R + 33); const k = (i - si + 5) % 5 + 1;
    if(s === active) o += `<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`;
    o += `<circle cx="${x}" cy="${y}" r="19" style="fill:${COL[s]}"${present.has(s) ? '' : ' opacity=".35"'}/><text x="${x}" y="${y + 6.5}" text-anchor="middle" font-size="18" font-weight="800" style="fill:${textFor(s)}">${s}</text>`;
    o += `<text x="${bx}" y="${by + 4}" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:${k === 1 ? 'var(--accent)' : 'var(--muted)'}">${k === 1 ? 'start' : ordinal(k)}</text>`;
  });
  return o + '</svg>';
}
function shapesTable(list, idx){
  return `<div class="table-wrap"><table class="shapes"><thead><tr><th scope="col">Shape</th>${STRING_LABEL.map(s => `<th scope="col">${s}</th>`).join('')}<th scope="col">Frets</th></tr></thead><tbody>${list.map((inst, i) => `<tr class="${i === idx ? 'on' : ''}" data-act="pick" data-v="${i}" tabindex="0" aria-label="${inst.shape}-shape, frets ${inst.minF} to ${inst.maxF}"><td>${pill(inst.shape)}</td>${inst.frets.map(f => `<td>${f == null ? 'x' : f}</td>`).join('')}<td>${inst.minF}–${inst.maxF}</td></tr>`).join('')}</tbody></table></div>`;
}
function linkLine(a, b){
  const sh = sharedRoots(a, b);

const T = {mode:'shape', minor:false, hint:true, q:null, picked:null, sel:new Set(), score:0, total:0, streak:0, feedback:'', ok:null};
const TRAIN_MODES = [['shape', 'Name the shape'], ['chord', 'Name the chord'], ['roots', 'Roots in a shape'], ['build', 'Build a shape'], ['octaves', 'Every root on the neck'], ['ear', 'Major or minor?'], ['order', 'Shape order']];
const HOME = {E:0, G:0, A:1, C:1, D:2}; // the string each shape's anchor root sits on

const statOf = k => progress.stats[k] || {r:0, w:0};

const BOX_DAYS = [0, 1, 2, 4, 8], DAY = 86400000;

function pickWeighted(items){ const ws = items.map(weightOf); let x = Math.random() * ws.reduce((a, b) => a + b, 0); for(let i = 0; i < items.length; i++){ x -= ws[i]; if(x <= 0) return items[i]; } return items[items.length - 1]; }

function newQ(){

    T.q = {type:'octaves', pc, want, stat:k, prompt:`Click every ${MAJOR_NAMES[pc]} between the nut and fret 12, then press Check.`, explain:`There are ${want.length} of them. The octave shapes find them fast: E→D string +2 frets, A→G +2, D→B +3, G→high e +3, and low E = high e.`};

    } else T.sel.forEach(k => { const [s, f] = k.split(':').map(Number); dots.push({s, f, colors:['var(--accent)'], cls:'sel', label:'', text:'#fff'}); });
    return board({from:0, to:MAX_FRET, dots, label:'Build the shape fretboard'});
  }

    const want = new Set(q.want); const dots = [];

      want.forEach(k => { const [s, f] = k.split(':').map(Number); const got = T.sel.has(k); dots.push({s, f, colors:[got ? 'var(--good)' : 'var(--warn)'], root:true, label:got ? '✓' : '!', text:'#fff'}); });
      T.sel.forEach(k => { if(!want.has(k)){ const [s, f] = k.split(':').map(Number); dots.push({s, f, colors:['var(--bad)'], label:'✗', text:'#fff'}); } });
    } else T.sel.forEach(k => { const [s, f] = k.split(':').map(Number); dots.push({s, f, colors:['var(--accent)'], cls:'sel', label:'', text:'#fff'}); });

function answerQ(v){

  const right = prefs.lefty ? -1 : 1, up = prefs.lowTop ? -1 : 1;
  if(e.key === 'ArrowRight') nf += right; else if(e.key === 'ArrowLeft') nf -= right;
  else if(e.key === 'ArrowUp') ns += up; else if(e.key === 'ArrowDown') ns -= up;
  else if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); t.dispatchEvent(new MouseEvent('click', {bubbles:true})); return; }
  else return;
  e.preventDefault(); e.stopPropagation();
  const svg = t.ownerSVGElement; const nx = svg && svg.querySelector(`.hit[data-s="${ns}"][data-f="${nf}"]`);
  if(nx){ t.setAttribute('tabindex', '-1'); nx.setAttribute('tabindex', '0'); nx.focus(); boardFocus = {s:ns, f:nf}; $('#sr').textContent = nx.getAttribute('aria-label'); }
});
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey || !V) return;
  const t = e.target; const tag = t.tagName;
  if(tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SUMMARY') return;
  if((tag === 'BUTTON' || tag === 'A' || tag === 'TR') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = V.keys || {};
  if(e.key === ' ' && k.space){ e.preventDefault(); ac(); k.space(); }
  else if(e.key === 'ArrowLeft' && k.left){ e.preventDefault(); ac(); k.left(); }
  else if(e.key === 'ArrowRight' && k.right){ e.preventDefault(); ac(); k.right(); }
  else if(k.char && k.char(e.key)){ e.preventDefault(); ac(); }
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden && (clock.timer || clock.queue.length || walkT.length)){ stopAll(); if(V) render(); toast('Playback stopped while the tab was hidden. Press play to start again.'); }
});
$('#skip-board').addEventListener('click', () => { const h = view.querySelector('.hit[tabindex="0"]'); if(h) h.focus(); });
$('#btn-sound').addEventListener('click', () => { ac(); setMuted(!audio.muted); });
$('#chip-timer').addEventListener('click', () => { location.hash = 'practice'; });
const optLefty = $('#opt-lefty'), optLow = $('#opt-lowtop');
optLefty.checked = prefs.lefty; optLow.checked = prefs.lowTop;
optLefty.addEventListener('change', () => { prefs.lefty = optLefty.checked; savePrefs(); render(); });
optLow.addEventListener('change', () => { prefs.lowTop = optLow.checked; savePrefs(); render(); });
document.addEventListener('click', e => { const d = $('#settings'); if(d.open && !d.contains(e.target)) d.open = false; });
document.addEventListener('keydown', e => { const d = $('#settings'); if(e.key === 'Escape' && d.open){ d.open = false; d.querySelector('summary').focus(); } });
window.addEventListener('hashchange', go);
R.remaining = routine()[0].min * 60;
renderChips();
go();
</script>
